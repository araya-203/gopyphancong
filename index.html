<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KHAI BÁO ĐIỀU CHỈNH PHÂN CÔNG</title>

<style>
body{
  margin:0;
  font-family: Arial, sans-serif;
  background:#0b1220;
}
.container{
  max-width:900px;
  margin:20px auto;
  background:#fff;
  padding:25px;
  border-radius:12px;
}
h1{
  text-align:center;
  text-transform:uppercase;
}
label{font-weight:bold;}
input, textarea{
  width:100%;
  padding:10px;
  margin:8px 0 18px;
}
.box{
  display:flex;
  flex-wrap:wrap;
  gap:10px;
}
.choice{
  padding:10px 14px;
  border:1px solid #333;
  border-radius:20px;
  cursor:pointer;
  background:#fff;
}
.choice.active{
  background:#ffd400;
}
.hidden{display:none;}
button{
  width:100%;
  padding:14px;
  font-size:16px;
  background:#ffd400;
  border:none;
  border-radius:8px;
  cursor:pointer;
}
</style>
</head>

<body>
<div class="container">

<h1>KHAI BÁO ĐIỀU CHỈNH PHÂN CÔNG</h1>

<label>Họ và tên:</label>
<input id="hoten" placeholder="Nhập họ và tên">

<label>Hoạt động <span id="ban">[BẠN]</span> muốn khai báo</label>
<div class="box" id="hoatdongBox"></div>

<div id="congviecSection" class="hidden">
  <label><span id="ban2">[BẠN]</span> đã làm những gì</label>
  <div class="box" id="congviecBox"></div>
</div>

<div id="minhchungSection" class="hidden">
  <label>Minh chứng (link / nội dung):</label>
  <textarea id="minhchung" rows="4"></textarea>
</div>

<label>Công việc theo sổ phân công hiện là của ai?</label>
<input id="cuaai" placeholder="Nhập tên">

<button onclick="gui()">GỬI KHAI BÁO</button>

</div>

<script>
const hoatdongList=[
"95 năm rực cháy khát vọng tuổi trẻ",
"Không gian học nhóm",
"Tuổi trẻ Địa chất tự hào dưới cờ Đảng",
"Chương trình Hành trình thanh niên theo dấu chân về nguồn",
"Giao lưu cầu lông"
];

const congviecList=[
"BẢN KẾ HOẠCH","FORM","CANVA","BÀI TRUYỀN THÔNG",
"DỰ TRÙ KINH PHÍ","CHỤP ẢNH","DỰNG VIDEO","NỘI DUNG KHÁC"
];

let hoatdongChon=[];
let congviecChon=[];

const hoatdongBox=document.getElementById("hoatdongBox");
hoatdongList.forEach(h=>{
  const d=document.createElement("div");
  d.className="choice";
  d.innerText=h;
  d.onclick=()=>{
    d.classList.toggle("active");
    hoatdongChon.includes(h)
      ? hoatdongChon=hoatdongChon.filter(x=>x!==h)
      : hoatdongChon.push(h);
    document.getElementById("congviecSection").classList.toggle("hidden",hoatdongChon.length===0);
  };
  hoatdongBox.appendChild(d);
});

const congviecBox=document.getElementById("congviecBox");
congviecList.forEach(c=>{
  const d=document.createElement("div");
  d.className="choice";
  d.innerText=c;
  d.onclick=()=>{
    d.classList.toggle("active");
    congviecChon.includes(c)
      ? congviecChon=congviecChon.filter(x=>x!==c)
      : congviecChon.push(c);
    document.getElementById("minhchungSection").classList.toggle("hidden",congviecChon.length===0);
  };
  congviecBox.appendChild(d);
});

document.getElementById("hoten").oninput=function(){
  const p=this.value.trim().split(" ");
  if(p.length>=2){
    const ten=p.slice(-2).join(" ");
    document.getElementById("ban").innerText=ten;
    document.getElementById("ban2").innerText=ten;
  }
};

function gui(){
  const data={
    hoten:document.getElementById("hoten").value,
    tenrutgon:document.getElementById("ban").innerText,
    hoatdong:hoatdongChon.join(", "),
    congviecdalam:congviecChon.join(", "),
    minhchung:document.getElementById("minhchung").value,
    congviecphancong:"",
    cuaai:document.getElementById("cuaai").value,
    ghichu:""
  };

  fetch("https://script.google.com/macros/s/AKfycbzL0Z0gHlc4bbTdS9EJHSHGRZZ7qOFhm9iefm8n8FKsbu33XBdUI--XHnNvuPdRIvIuSw/exec",{
    method:"POST",
    body:JSON.stringify(data),
    headers:{"Content-Type":"application/json"}
  })
  .then(()=>alert("✅ Gửi thành công"))
  .catch(()=>alert("❌ Lỗi gửi dữ liệu"));
}
</script>

</body>
</html>
